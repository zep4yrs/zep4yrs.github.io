    <script>
      // 首次访问按浏览器语言跳转，之后以用户选择为准
      (function () {
        try {
          var stored = localStorage.getItem('zep-work-lang')
          if (stored === 'zh' || stored === 'en') return
          var nav = (navigator.language || 'zh').toLowerCase()
          var want = nav.indexOf('zh') === 0 ? 'zh' : 'en'
          var p = location.pathname
          if (p === '/' || p === '') {
            location.replace('/' + want + '/' + location.search + location.hash)
          }
        } catch (e) {}
      })()
    </script>
